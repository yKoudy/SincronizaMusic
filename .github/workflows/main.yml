name: Criar Sincroniza Music EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Compilar aplicativo
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Sincroniza Music" --collect-all pygame src/main.py

      - name: Disponibilizar executavel
        uses: actions/upload-artifact@v4
        with:
          name: Sincroniza-Music-Windows
          path: "dist/Sincroniza Music/"
          if-no-files-found: error
          retention-days: 7

name: Sincroniza Music Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verificar arquivos
        run: |
          if (!(Test-Path "src/main.py")) { throw "Falta src/main.py" }
          if (!(Test-Path "requirements.txt")) { throw "Falta requirements.txt" }
        shell: pwsh

      - name: Gerar aplicativo EXE
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Sincroniza Music" --collect-all pygame src/main.py
        shell: pwsh

      - name: Publicar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: Sincroniza-Music-Windows
          path: "dist/Sincroniza Music/"
          if-no-files-found: error
          retention-days: 7
